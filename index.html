<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Nornickel Reader Portal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    .card {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      transform-origin: center;
    }
    .card:hover {
      transform: scale(1.05);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
    }
    .card img {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .card:hover img {
      transform: scale(1.02);
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center">
  <h1 class="text-3xl font-bold my-8">Библиотека департамента общественных связей</h1>
  
  <!-- Bento Grid Layout -->
  <div class="w-full max-w-6xl px-4">
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 h-[600px]">
      <!-- Large Card - Left Side -->
      <div class="lg:col-span-2">
        <a href="papers.html" class="card block bg-white rounded-lg overflow-hidden h-full relative">
          <img src="" alt="Analytical Papers Collection" class="w-full h-full object-cover object-top">
          <div class="absolute inset-0 bg-black bg-opacity-40 flex items-center justify-center">
            <div class="text-center text-white">
              <h2 class="text-2xl font-bold mb-2">Аналитические материалы</h2>
              <p class="text-lg">Коллекция аналитических материалов</p>
            </div>
          </div>
        </a>
      </div>
      
      <!-- Right Side - Two Smaller Cards -->
      <div class="lg:col-span-1 flex flex-col gap-6">
        <!-- Top Small Card -->
        <div class="flex-1">
          <a href="#" class="card block bg-white rounded-lg overflow-hidden h-full relative">
            <img src="" alt="Weekly News Collection" class="w-full h-full object-cover object-top">
            <div class="absolute inset-0 bg-black bg-opacity-40 flex items-center justify-center">
              <div class="text-center text-white">
                <h3 class="text-lg font-bold mb-1">Недельная подборка новостей MENA и Китая</h3>
                <p class="text-sm">MENA, Китай</p>
              </div>
            </div>
          </a>
        </div>
        
        <!-- Bottom Small Card -->
        <div class="flex-1">
          <a href="#" class="card block bg-white rounded-lg overflow-hidden h-full relative">
            <img src="" alt="Market Analysis" class="w-full h-full object-cover object-top">
            <div class="absolute inset-0 bg-black bg-opacity-40 flex items-center justify-center">
              <div class="text-center text-white">
                <h3 class="text-lg font-bold mb-1">ESG дайджесты</h3>
                <p class="text-sm">ESG</p>
              </div>
            </div>
          </a>
        </div>
      </div>
    </div>
  </div>
  
  <footer class="mt-16 mb-4 text-gray-500 text-xs">© 2025 "Норникель"</footer>
</body>
</html>
